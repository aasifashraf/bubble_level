# Draft recipe for F-Droid (fdroiddata/metadata/dev.aasifashraf.bubblelevel.yml).
# Send it as a merge request to https://gitlab.com/fdroid/fdroiddata once the
# GitHub repo is public and tagged v1.0.0. F-Droid builds the `foss` flavour
# from source (no Google libraries) and signs the APK itself.
Categories:
  - Science & Education
License: GPL-3.0-only
AuthorName: Aasif Ashraf
AuthorEmail: contact@aasifashraf.dev
SourceCode: https://github.com/aasifashraf/bubble_level
IssueTracker: https://github.com/aasifashraf/bubble_level/issues
Donate: https://github.com/sponsors/aasifashraf

AutoName: Bubble Level

RepoType: git
Repo: https://github.com/aasifashraf/bubble_level.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    srclibs:
      - flutter@3.47.6
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor foss

