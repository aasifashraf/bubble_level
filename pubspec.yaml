name: bubble_level
description: "Bubble level, angle finder, compass, ruler and sensor meters in one app."
publish_to: 'none'

# version: name+build. The build number (versionCode) must rise with every
# store upload.
version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  # Temp files for the generated tones (the low-latency player needs files).
  path_provider: ^2.1.6
  intl: ^0.20.2
  # Pinned: the sound meter relies on its in-memory PCM stream and audio
  # source options; check them before moving to a newer major or minor.
  record: 7.1.1
  camera: ^0.12.1
  # iOS location only; Android uses its own LocationManager (Gps.kt), so
  # the F-Droid build has no Google Play services.
  geolocator_apple: ^2.3.14
  geolocator_platform_interface: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # Builds AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true

  # Shown on the licences page (registered in main.dart).
  assets:
    - assets/fonts/Inter-OFL.txt

  # Inter 4.1 variable font (SIL OFL 1.1), https://github.com/rsms/inter
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf

# App icon, generated from assets/icon/ (see tool/icon/render_icon_test.dart):
#   dart run flutter_launcher_icons
#   git checkout ios/Runner.xcodeproj/project.pbxproj   # the tool mis-edits it
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # The foreground is already drawn inside the safe zone.
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 24
